        const playTone = (freq, type, duration) => {
            initAudio();
            if(!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = type;
                oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        };
        const playCorrectSound = () => { playTone(523.25, 'sine', 0.1); setTimeout(() => playTone(659.25, 'sine', 0.2), 100); };

                    if (q.isCorrect) correctCount++;

            quizState.questions.forEach(q => {
                if (!q.showExplanation) {
                    q.showExplanation = true; q.isCorrect = false; q.selectedAns = -1;
                }

            quizState.isFinished = true; quizState.correctCount = correctCount; quizState.answeredCount = answeredCount;
            const total = quizState.questions.length;
            const scorePercent = Math.round((correctCount / total) * 100);

            if (!userData.favorites) return;
            const idx = userData.favorites.indexOf(qText);
            if (idx > -1) {
                if(confirm('確定要從最愛中移除此題嗎？')) {
                    userData.favorites.splice(idx, 1);
                    saveUserDataToCloud();
                    renderFavorites();
                }
            }
        };

        window.renderHistory = (container) => {
            if(!container) container = document.getElementById('main-content');
            if((!userData.quizHistory || userData.quizHistory.length === 0) && (!userData.loginHistory || userData.loginHistory.length === 0)) {
                container.innerHTML = `
                    <div class="w-full flex-1 flex items-center justify-center p-4 md:p-6 text-slate-400 flex-col text-center relative z-10 animate-fade-in">
                        <div class="w-40 h-40 bg-slate-50 rounded-full flex items-center justify-center mb-8 border border-slate-200 text-7xl">📜</div>
                        <h2 class="text-4xl md:text-5xl font-extrabold text-slate-700 mb-4">暫無紀錄</h2>
                        <p class="text-2xl md:text-3xl font-medium text-slate-500 mb-10">您還沒有完成任何測驗或留下足跡喔！</p>
                        <button onclick="switchTab('quiz')" class="bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 font-bold px-10 py-4 text-xl rounded-full shadow-sm transition-colors">🚀 前往測驗</button>
                    </div>`;
                return;
            }

            container.innerHTML = `
                <div class="w-full flex-1 p-3 md:p-6 lg:p-10 overflow-y-auto overflow-x-hidden pb-24 relative z-10">
                    <div class="w-full max-w-[96%] xl:max-w-[98%] mx-auto">
                        <div class="flex justify-between items-end border-b-2 border-slate-200 pb-5 mb-12">
                            <div>
                                <h2 class="text-4xl md:text-5xl font-extrabold text-slate-800 flex items-center"><span class="bg-purple-50 text-purple-500 w-14 h-14 flex items-center justify-center rounded-2xl mr-5 border border-purple-200">📜</span>作答與登入紀錄</h2>
                                <p class="text-slate-500 mt-3 ml-20 font-bold text-lg md:text-xl">追蹤您的學習軌跡，跨裝置同步更新 ☁️</p>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                            <!-- 作答紀錄 -->
                            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <div class="bg-slate-50 p-6 border-b border-slate-200">
                                    <h3 class="text-3xl font-bold text-slate-800 flex items-center"><span class="mr-3 text-3xl">🎯</span>最近作答成績</h3>
                                </div>
                                <div class="p-6 md:p-8 space-y-5 max-h-[60vh] overflow-y-auto">
                                    ${(userData.quizHistory || []).slice().reverse().map((h, i) => `
                                        <div class="flex justify-between items-center p-5 rounded-xl border border-slate-200 ${h.score >= 80 ? 'bg-emerald-50/30' : (h.score < 60 ? 'bg-red-50/30' : 'bg-slate-50')} transition-all hover:shadow-sm">
                                            <div>
                                                <div class="font-bold text-slate-800 text-xl md:text-2xl">${h.date}</div>
                                                <div class="text-lg text-slate-500 mt-2 font-medium">共 ${h.total} 題，答對 <span class="font-bold text-slate-700">${h.correct}</span> 題</div>
                                            </div>
                                            <div class="text-5xl font-black ${h.score >= 80 ? 'text-emerald-500' : (h.score < 60 ? 'text-red-400' : 'text-amber-500')}">${h.score}<span class="text-2xl ml-1 font-bold">分</span></div>
                                        </div>
                                    `).join('') || '<p class="text-xl text-slate-400 text-center py-10 font-bold">目前還沒有測驗紀錄喔</p>'}
                                </div>
                            </div>

                            <!-- 登入紀錄 -->
                            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden h-fit">
                                <div class="bg-slate-50 p-6 border-b border-slate-200">
                                    <h3 class="text-3xl font-bold text-slate-800 flex items-center"><span class="mr-3 text-3xl">👣</span>最近登入足跡</h3>
                                </div>
                                <div class="p-6 md:p-8 space-y-4 max-h-[40vh] overflow-y-auto">
                                    ${(userData.loginHistory || []).slice().reverse().map((time, i) => `
                                        <div class="flex items-center p-4 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-slate-100 transition-colors">
                                            <span class="w-10 h-10 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-slate-500 mr-4 text-lg font-bold shadow-sm">${i+1}</span>
                                            <span class="font-bold text-slate-700 text-xl">${new Date(time).toLocaleString()}</span>
                                        </div>
                                    `).join('') || '<p class="text-xl text-slate-400 text-center py-10 font-bold">無登入紀錄</p>'}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        window.printAllQuestions = () => {
            const qList = generate50Questions();
            const baseUrl = window.location.href.split('?')[0].split('#')[0];
            
            let printHtml = `
            <!DOCTYPE html>
            <html lang="zh-TW">
            <head>
                <meta charset="UTF-8">
                <title>九年級第一次會考模擬 - 自然科試題本</title>
                <base href="${baseUrl}">
                <style>
                    /* 設定為標楷體 */
                    body { font-family: 'BiauKai', 'DFKai-SB', 'KaiTi', '楷体', serif; line-height: 1.5; color: #000; padding: 20px; max-width: 800px; margin: 0 auto; }
                    
                    u { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
                    u.book { text-decoration: underline wavy; text-underline-offset: 4px; text-decoration-thickness: 1px; }

                    .cover-page { 
                        display: flex; 
                        flex-direction: column; 
                        justify-content: center; 
                        align-items: center; 
                        min-height: 85vh; 
                        page-break-after: always; 
                    }
                    .cover-title-main { font-size: 32px; margin-bottom: 15px; font-weight: bold; text-align: center; }
                    .cover-title-sub { font-size: 48px; margin-bottom: 25px; font-weight: bold; letter-spacing: 5px; text-align: center; }
                    .cover-title-range { font-size: 22px; margin-bottom: 60px; text-align: center; }
                    
                    .student-info { font-size: 22px; margin-bottom: 40px; display: flex; justify-content: center; gap: 40px; }
                    .info-field { display: flex; align-items: flex-end; }
                    .info-line { border-bottom: 1px solid #000; width: 180px; display: inline-block; margin-left: 10px; height: 20px; }
                    
                    .grading-table { border-collapse: collapse; font-size: 26px; border: 2px solid #000; margin: 0 auto; width: 450px; }
                    .grading-table td { border: 1px solid #000; }
                    .score-row { text-align: center; padding: 20px; font-size: 28px; }
                    .box-wrap { display: inline-flex; align-items: center; width: 90px; }
                    .box { display: inline-block; width: 22px; height: 22px; border: 2px solid #000; margin-right: 6px; flex-shrink: 0; }
                    sup { font-size: 16px; margin-left: 2px; }

                    .question-block { margin-bottom: 12px; page-break-inside: avoid; border-bottom: 1px dashed #eee; padding-bottom: 8px; }
                    .question-row { display: flex; align-items: flex-start; margin-bottom: 8px; }
                    .q-num { font-size: 15px; font-weight: bold; min-width: 32px; flex-shrink: 0; }
                    .q-text { font-size: 15px; font-weight: bold; flex: 1; }
                    
                    .options { margin-left: 32px; font-size: 15px; padding-left: 0; margin-top: 0; margin-bottom: 4px; }
                    .opt-item { display: flex; align-items: flex-start; margin-bottom: 2px; }
                    .opt-label { min-width: 40px; flex-shrink: 0; }
                    .opt-content { flex: 1; }
                    
                    img { max-width: 60%; max-height: 240px; object-fit: contain; display: block; margin: 8px 0; border: 1px solid #ddd; }
                    
                    .print-btn-container { text-align: center; margin-bottom: 30px; position: sticky; top: 0; background: rgba(255,255,255,0.9); padding: 15px; z-index: 100; border-bottom: 1px solid #ddd; }
                    .print-btn { background-color: #34d399; color: white; border: none; padding: 12px 24px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background-color 0.3s; }
                    .print-btn:hover { background-color: #10b981; }
                    @media print {
                        .print-btn-container { display: none !important; }
                        body { max-width: none; padding: 0; margin: 0; }
                        .question-block { border-bottom: none; }
                    }
                </style>
            </head>
            <body>
                <div class="print-btn-container no-print">
                    <button class="print-btn" onclick="window.print()">🖨️ 確認列印考卷</button>
                    <p style="font-size:14px; color:#666; margin-top:8px;">(建議等待圖片全部載入完成後，再點擊列印按鈕)</p>
                </div>
                
                <div class="cover-page">
                    <div class="cover-title-main">九年級第一次國中教育會考模擬試題</div>
                    <div class="cover-title-sub">自然科試題本</div>
                    <div class="cover-title-range">範圍：第1、3冊</div>
                    
                    <div class="student-info">
                        <div class="info-field"><span>姓名：</span><span class="info-line"></span></div>
                        <div class="info-field"><span>測驗日期：</span><span class="info-line"></span></div>
                    </div>
                    
                    <table class="grading-table">
                        <tr>
                            <td colspan="2" class="score-row">答對題數：<span style="display:inline-block; border-bottom:1px solid #000; width: 60px; margin: 0 10px;"></span> 題</td>
                        </tr>
                        <tr>
                            <td colspan="2" style="text-align: center; border-bottom: none; padding-bottom: 5px; padding-top: 15px;">☆☆能力等級☆☆</td>
                        </tr>
                        <tr>
                            <td style="border-top: none; border-right: none; border-bottom: none; text-align: right; width: 130px; padding: 5px 0;">精　熟：</td>
                            <td style="border-top: none; border-left: none; border-bottom: none; padding: 5px 0 5px 10px;">
                                <span class="box-wrap"><span class="box"></span>A<sup>++</sup></span>
                                <span class="box-wrap"><span class="box"></span>A<sup>+</sup></span>
                                <span class="box-wrap"><span class="box"></span>A</span>
                            </td>
                        </tr>
                        <tr>
                            <td style="border-top: none; border-right: none; border-bottom: none; text-align: right; padding: 5px 0;">基　礎：</td>
                            <td style="border-top: none; border-left: none; border-bottom: none; padding: 5px 0 5px 10px;">
                                <span class="box-wrap"><span class="box"></span>B<sup>++</sup></span>
                                <span class="box-wrap"><span class="box"></span>B<sup>+</sup></span>
                                <span class="box-wrap"><span class="box"></span>B</span>
                            </td>
                        </tr>
                        <tr>
                            <td style="border-top: none; border-right: none; text-align: right; padding: 5px 0 20px 0;">待加強：</td>
                            <td style="border-top: none; border-left: none; padding: 5px 0 20px 10px;">
                                <span class="box-wrap"><span class="box"></span>C</span>
                            </td>
                        </tr>
                    </table>
                </div>
            `;

            qList.forEach((q, idx) => {
                let optionsHtml = '<div class="options">';
                q.opts.forEach((opt, optIdx) => {
                    const letter = String.fromCharCode(65 + optIdx);
                    optionsHtml += `<div class="opt-item"><div class="opt-label">（${letter}）</div><div class="opt-content">${opt}</div></div>`;
                });
                optionsHtml += '</div>';

                printHtml += `
                <div class="question-block">
                    <div class="question-row">
                        <div class="q-num">${idx + 1}.</div>
                        <div class="q-text">${q.q}</div>
                    </div>
                    ${optionsHtml}
                </div>
                `;
            });

            printHtml += `
            </body>
            </html>
            `;

            const printWin = window.open('', '_blank');
            printWin.document.open();
            printWin.document.write(printHtml);
            printWin.document.close();
        };

        initApp();

    </script>
</body>
</html>
